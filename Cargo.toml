[package]
name = "news"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
yahoo_finance_api = "5.0.0"
time = { version = "0.3.55", features = ["macros"] }
chrono = "0.4.45"
